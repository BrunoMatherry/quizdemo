
<style>
  .wheel-container { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; gap: 1.5rem; }
  .spin-btn { font-size: 16px; font-weight: 500; padding: 12px 36px; border-radius: 50px; border: none; background: #1a1a2e; color: #fff; cursor: pointer; transition: transform 0.1s, background 0.2s; }
  .spin-btn:hover { background: #2d2d50; }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .result-box { font-size: 18px; font-weight: 500; color: var(--color-text-primary); min-height: 28px; text-align: center; }
  .wheel-wrap { position: relative; width: 320px; height: 320px; }
  canvas { border-radius: 50%; }
  .pointer { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid #1a1a2e; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
</style>
<h2 class="sr-only">Roleta QuizMoz com 5 categorias: Moçambique & África, Ciência & Mundo, Língua & Cultura, Bíblia & Finanças, Temas Diversos</h2>
<div class="wheel-container">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="320" height="320"></canvas>
  </div>
  <button class="spin-btn" id="spinBtn" onclick="spin()">🎲 Girar Roleta</button>
  <div class="result-box" id="result"></div>
</div>
<script>
const categories = [
  { label: "Moçambique\n& África",     color: "#F5C842", textColor: "#5a3e00", icon: "🌍" },
  { label: "Ciência &\nMundo",          color: "#E05A8A", textColor: "#fff",    icon: "🔬" },
  { label: "Língua &\nCultura",         color: "#9B59D0", textColor: "#fff",    icon: "📖" },
  { label: "Bíblia &\nFinanças",        color: "#3BBFA0", textColor: "#fff",    icon: "💰" },
  { label: "Temas\nDiversos",           color: "#4A90D9", textColor: "#fff",    icon: "💡" },
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const total = categories.length;
const arc = (2 * Math.PI) / total;
const cx = 160, cy = 160, r = 148;

let currentAngle = 0;
let spinning = false;

function drawWheel(angle) {
  ctx.clearRect(0, 0, 320, 320);

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, r + 6, 0, 2 * Math.PI);
  ctx.fillStyle = "#1a1a2e";
  ctx.fill();

  for (let i = 0; i < total; i++) {
    const start = angle + i * arc;
    const end = start + arc;
    const cat = categories[i];

    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = cat.color;
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Text
    const midAngle = start + arc / 2;
    const textR = r * 0.62;
    const tx = cx + Math.cos(midAngle) * textR;
    const ty = cy + Math.sin(midAngle) * textR;

    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(midAngle + Math.PI / 2);

    const lines = cat.label.split('\n');
    ctx.fillStyle = cat.textColor;
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const lineH = 16;
    const offsetY = -((lines.length - 1) * lineH) / 2;
    lines.forEach((line, j) => {
      ctx.fillText(line, 0, offsetY + j * lineH);
    });

    // Icon above text
    ctx.font = "18px sans-serif";
    ctx.fillText(cat.icon, 0, offsetY - 22);

    ctx.restore();
  }

  // Center circle
  ctx.beginPath();
  ctx.arc(cx, cy, 38, 0, 2 * Math.PI);
  ctx.fillStyle = "#1a1a2e";
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("QuizMoz", cx, cy);
}

function getSelectedCategory(angle) {
  // Pointer points down (top = -PI/2), so we find which slice is at top
  const normalized = ((-angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const idx = Math.floor(normalized / arc) % total;
  return categories[idx];
}

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('result').textContent = '';

  const extraSpins = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI;
  const extraAngle = Math.random() * 2 * Math.PI;
  const target = currentAngle + extraSpins + extraAngle;
  const duration = 4000;
  const start = performance.now();
  const startAngle = currentAngle;

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    currentAngle = startAngle + (target - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = target;
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      const cat = getSelectedCategory(currentAngle);
      document.getElementById('result').textContent = `${cat.icon} ${cat.label.replace('\n', ' ')}`;
    }
  }

  requestAnimationFrame(animate);
}

drawWheel(currentAngle);
</script>
